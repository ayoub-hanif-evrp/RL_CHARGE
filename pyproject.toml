[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-charge"
version = "0.1.0"
description = "Fixed-route EV charging scheduling on the EVRPTW-GR dataset"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pyvrp==0.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
