# Published Montoya et al. (2017) / VRP-REP 2016-0020 piecewise charging knots.
# Source: e-VRO/frvcpy instances/vrprep-instance.xml (battery_level in Wh, time in hours).
# Using these on EVRPTW-GR is a sensitivity conversion, not original EVRPTW-GR physics.
# SOC = charge_wh / battery_wh. Time may be rescaled so a full charge matches g*Q.

source = "Montoya et al. 2017 / VRP-REP 2016-0020 / e-VRO/frvcpy vrprep-instance.xml"
equivalent_to_evrptwgr = "not_original_evrptwgr"
battery_wh = 16000.0

[curves.fast]
charge_wh = [0.0, 13600.0, 15200.0, 16000.0]
time_h = [0.0, 0.31, 0.39, 0.51]

[curves.normal]
charge_wh = [0.0, 13600.0, 15200.0, 16000.0]
time_h = [0.0, 0.62, 0.77, 1.01]

[curves.slow]
charge_wh = [0.0, 13600.0, 15200.0, 16000.0]
time_h = [0.0, 1.26, 1.54, 2.04]
